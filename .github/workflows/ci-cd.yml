name: Run Integration, Unit Tests and Data Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # ============================================================
  # JOB 1
  # TEST APPLICATION + RUN DATA PIPELINE
  # ============================================================
  test-and-pipeline:

    name: Tests and Data Pipeline

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_DB: monitoring_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d monitoring_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Python
      # ----------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip


      # ----------------------------------------------------------
      # 3. Install dependencies
      # ----------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install pytest pytest-asyncio alembic psycopg

          pip install -r backend/requirements-dev.txt


      # ----------------------------------------------------------
      # 4. Database migrations
      # ----------------------------------------------------------
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_password@localhost:5432/monitoring_test

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: monitoring_test

          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_BASE_URL: ${{ secrets.KOBO_BASE_URL }}
          KOBO_REQUEST_TIMEOUT_SECONDS: ${{ secrets.KOBO_REQUEST_TIMEOUT_SECONDS }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          API_AUTH_ENABLED: "False"
          API_KEY: ci_test_api_key_placeholder

        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/backend

          alembic upgrade head


      # ----------------------------------------------------------
      # 5. Unit + integration tests
      # ----------------------------------------------------------
      - name: Run unit and integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_password@localhost:5432/monitoring_test

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: monitoring_test

          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_BASE_URL: ${{ secrets.KOBO_BASE_URL }}
          KOBO_REQUEST_TIMEOUT_SECONDS: ${{ secrets.KOBO_REQUEST_TIMEOUT_SECONDS }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          API_AUTH_ENABLED: "False"
          API_KEY: ci_test_api_key_placeholder

        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/backend

          python -m pytest tests/ -v


      # ----------------------------------------------------------
      # 6. Data pipeline
      # ----------------------------------------------------------
      - name: Run data pipeline
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_password@localhost:5432/monitoring_test

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: monitoring_test

          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_BASE_URL: ${{ secrets.KOBO_BASE_URL }}
          KOBO_REQUEST_TIMEOUT_SECONDS: ${{ secrets.KOBO_REQUEST_TIMEOUT_SECONDS }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          API_AUTH_ENABLED: "False"
          API_KEY: ci_test_api_key_placeholder

        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/backend

          python run_pipeline.py


      # ----------------------------------------------------------
      # 7. Monitoring verification
      # ----------------------------------------------------------
      - name: Verify monitoring aggregates
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres_password@localhost:5432/monitoring_test

          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: monitoring_test

          KOBO_API_TOKEN: ${{ secrets.KOBO_API_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_BASE_URL: ${{ secrets.KOBO_BASE_URL }}
          KOBO_REQUEST_TIMEOUT_SECONDS: ${{ secrets.KOBO_REQUEST_TIMEOUT_SECONDS }}

          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

          API_AUTH_ENABLED: "False"
          API_KEY: ci_test_api_key_placeholder

        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/backend

          python check_monitoring.py


  # ============================================================
  # JOB 2
  # BUILD + PUSH PRODUCTION IMAGE
  # ============================================================
  build-and-push:

    name: Build and Push Docker Image

    runs-on: ubuntu-latest

    needs: test-and-pipeline

    # Never publish Docker images from pull requests.
    if: github.event_name == 'push'

    steps:

      # ----------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Login to Docker Hub
      # ----------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ----------------------------------------------------------
      # 3. Set Docker image variables
      # ----------------------------------------------------------
      - name: Set Docker image variables
        run: |
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"


      # ----------------------------------------------------------
      # 4. Build production image through Docker Compose
      # ----------------------------------------------------------
      - name: Build production image with Docker Compose
        run: |
          docker compose -f production-docker-compose.yml build api


      # ----------------------------------------------------------
      # 5. Tag image as latest
      # ----------------------------------------------------------
      - name: Tag image as latest
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-data-monitoring:${GITHUB_SHA} \
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-data-monitoring:latest


      # ----------------------------------------------------------
      # 6. Push immutable commit image
      # ----------------------------------------------------------
      - name: Push commit image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-data-monitoring:${GITHUB_SHA}


      # ----------------------------------------------------------
      # 7. Push latest image
      # ----------------------------------------------------------
      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/digital-data-monitoring:latest